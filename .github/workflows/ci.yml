name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package.json
            backend/package.json

      - name: Install Monorepo Dependencies
        run: |
          npm install --prefix frontend
          npm install --prefix backend

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Build & Typecheck
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Run Backend Build & Typecheck
        working-directory: backend
        run: npm run build

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_access_secret_key_minimum_32_chars_long
          OTP_SECRET: test_dedicated_delivery_hmac_secret_min_32_chars
          SUPER_ADMIN_EMAIL: superadmin@cakepoprush.com
        run: npm test
