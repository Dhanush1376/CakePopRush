    <path d="M1,15 Q8,8 16,8 Q24,8 31,15 Z"/>
    <circle cx="16" cy="6" r="2.5" class="f"/>
    <line x1="10" y1="16" x2="11" y2="28"/>
    <line x1="16" y1="16" x2="16" y2="28"/>
    <line x1="22" y1="16" x2="21" y2="28"/>
