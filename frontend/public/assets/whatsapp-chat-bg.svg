  <!-- 1. Coffee cup with steam (top-left) -->
  <g class="d" transform="translate(30, 25)">
    <path d="M5,12 h26 a3,3 0 0,1 3,3 v8 a12,12 0 0,1 -12,12 h-8 a12,12 0 0,1 -12,-12 v-8 a3,3 0 0,1 3,-3 z"/>
    <path d="M34,16 h4 a5,5 0 0,1 5,5 v2 a5,5 0 0,1 -5,5 h-4"/>
    <path d="M12,4 Q14,8 12,10 M18,3 Q20,7 18,9 M24,4 Q26,8 24,10"/>
    <path d="M2,35 h32"/>
  </g>

  <!-- 2. Speech Bubble (top-center) -->
  <g class="d" transform="translate(130, 30)">
    <rect x="0" y="0" width="32" height="22" rx="7"/>
    <path d="M7,22 l-3,6 l7,-3"/>
    <line x1="7" y1="7" x2="25" y2="7"/>
    <line x1="7" y1="12" x2="20" y2="12"/>
    <line x1="7" y1="16" x2="15" y2="16"/>
