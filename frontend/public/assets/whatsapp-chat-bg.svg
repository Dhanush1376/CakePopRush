  <g class="d" transform="translate(225, 305)">
    <circle cx="15" cy="15" r="7"/>
    <line x1="15" y1="3" x2="15" y2="0"/>
    <line x1="15" y1="27" x2="15" y2="30"/>
    <line x1="3" y1="15" x2="0" y2="15"/>
    <line x1="27" y1="15" x2="30" y2="15"/>
    <line x1="6" y1="6" x2="4" y2="4"/>
    <line x1="24" y1="24" x2="26" y2="26"/>
    <line x1="6" y1="24" x2="4" y2="26"/>
    <line x1="24" y1="6" x2="26" y2="4"/>
