<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .d { fill: none; stroke: #4A4036; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.08; }
