  <circle cx="185" cy="75" r="1.5" class="f"/>
  <circle cx="285" cy="75" r="1.5" class="f"/>
  <circle cx="385" cy="75" r="1.5" class="f"/>

  <circle cx="85" cy="165" r="1.5" class="f"/>
  <circle cx="185" cy="165" r="1.5" class="f"/>
  <circle cx="285" cy="165" r="1.5" class="f"/>
  <circle cx="385" cy="165" r="1.5" class="f"/>

  <circle cx="85" cy="265" r="1.5" class="f"/>
  <circle cx="185" cy="265" r="1.5" class="f"/>
  <circle cx="285" cy="265" r="1.5" class="f"/>
  <circle cx="385" cy="265" r="1.5" class="f"/>

  <circle cx="85" cy="365" r="1.5" class="f"/>
  <circle cx="185" cy="365" r="1.5" class="f"/>
  <circle cx="285" cy="365" r="1.5" class="f"/>
  <circle cx="385" cy="365" r="1.5" class="f"/>
